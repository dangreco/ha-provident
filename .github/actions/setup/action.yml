name: Setup
description: >
  Nix with cache, the flake's `ci` dev shell exported into later steps, and the uv venv.
  Caches are saved only from `dev`; PRs restore read-only.

inputs:
  venv:
    description: Also create the venv (`make py-dev`); jobs that only run hooks skip it.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    - name: Setup Nix cache
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        save: ${{ github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' }}
        gc-max-store-size-linux: 2G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-last-accessed: P1DT12H
        purge-primary-key: never

    # `--profile` registers a GC root so the shell stays in the saved Nix cache.
    # Values come from this repo's flake, not event data; nothing here runs on pull_request_target.
    - name: Enter dev shell
      shell: bash
      run: | # zizmor: ignore[github-env]
        env_json="$RUNNER_TEMP/ci-shell.json"
        nix print-dev-env .#ci --profile "$RUNNER_TEMP/ci-shell" --json >"$env_json"
        jq -r '
          .variables
          | to_entries[]
          | select(.value.type == "exported")
          | select(.key | IN("PATH", "HOME", "TMPDIR", "TEMP", "TMP", "TEMPDIR",
                             "NIX_BUILD_TOP", "NIX_ENFORCE_PURITY", "NIX_LOG_FD",
                             "PWD", "OLDPWD", "SHLVL", "SHELL", "TERM", "TZ") | not)
          | "\(.key)<<__NIX_ENV_EOF__\n\(.value.value)\n__NIX_ENV_EOF__"
        ' "$env_json" >>"$GITHUB_ENV"
        # $GITHUB_PATH lines are prepended, so write in reverse.
        jq -r '.variables.PATH.value | split(":") | reverse[]' "$env_json" >>"$GITHUB_PATH"

    - name: uv cache
      if: ${{ inputs.venv == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: uv-${{ runner.os }}-

    - name: Create venv
      if: ${{ inputs.venv == 'true' }}
      shell: bash
      run: make py-dev
